name: Publish NuGet Package

on:
  push:
    tags:
      - 'Google.GenAI-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        if: github.repository == 'googleapis/dotnet-genai'
        run: dotnet restore Google.GenAI/Google.GenAI.csproj

      - name: Build
        if: github.repository == 'googleapis/dotnet-genai'
        run: dotnet build Google.GenAI/Google.GenAI.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        if: github.repository == 'googleapis/dotnet-genai'
        run: dotnet pack Google.GenAI/Google.GenAI.csproj --configuration Release --no-build --output ./nuget

      - name: Authenticate to Google Cloud
        if: github.repository == 'googleapis/dotnet-genai'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        if: github.repository == 'googleapis/dotnet-genai'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        if: github.repository == 'googleapis/dotnet-genai'
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=dotnet-genai--nuget \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=dotnet-genai--nuget \
              --quiet || true
          done

      - name: Publish NuGet package via OSS Exit Gate
        if: github.repository == 'googleapis/dotnet-genai'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PKG_FILE="$(ls ./nuget/Google.GenAI.*.nupkg | head -n 1)"
          PKG_VERSION="$(basename "${PKG_FILE}" .nupkg | sed 's/^Google\.GenAI\.//')"
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --repository=dotnet-genai--nuget \
            --location=us \
            --package=google.genai \
            --version="${PKG_VERSION}" \
            --source-directory=./nuget
          printf '{"publish_all": true}\n' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/dotnet-genai/nuget/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"